<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mini Block World</title>

<style>

body{
margin:0;
font-family:Arial;
background:#87CEEB;
}

#menu{
position:absolute;
width:100%;
height:100%;
background:#1c1c1c;
color:white;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
}

button{
padding:15px;
margin:10px;
font-size:18px;
}

#game{
display:none;
height:100vh;
position:relative;
}

#avatar{
width:40px;
height:60px;
background:#ffcc99;
position:absolute;
left:100px;
bottom:80px;
}

.block{
position:absolute;
width:60px;
height:60px;
background:#8B4513;
bottom:20px;
}

#chatBox{
position:absolute;
bottom:0;
width:100%;
background:#222;
color:white;
padding:5px;
}

#messages{
height:80px;
overflow:auto;
background:#111;
margin-bottom:5px;
}

</style>

</head>

<body>

<div id="menu">

<h1>Mini Block Game</h1>

<div>💰 Robux: 20000K</div>

<button onclick="start()">▶ Play</button>
<button onclick="avatar()">👤 Avatar</button>
<button onclick="voice()">🎤 Voice Chat</button>

</div>

<div id="game">

<div id="avatar"></div>

<div class="block" style="left:200px"></div>
<div class="block" style="left:260px"></div>
<div class="block" style="left:320px"></div>

<div id="chatBox">

<div id="messages"></div>

<input id="msg" placeholder="mesaj yaz">
<button onclick="send()">💬</button>

</div>

</div>

<script>

function start(){
document.getElementById("menu").style.display="none";
document.getElementById("game").style.display="block";
}

function avatar(){
console.log("avatar menüsü");
}

function voice(){
navigator.mediaDevices.getUserMedia({audio:true})
.then(function(stream){
console.log("mikrofon açık");
})
.catch(function(){
console.log("mikrofon hatası");
});
}

function send(){

let msg=document.getElementById("msg").value;

let messages=document.getElementById("messages");

messages.innerHTML += "<div>👤 "+msg+"</div>";

document.getElementById("msg").value="";

}

let avatar=document.getElementById("avatar");

let x=100;

document.addEventListener("touchstart",function(){

x+=40;

avatar.style.left=x+"px";

});

</script>

</body>
</html>
