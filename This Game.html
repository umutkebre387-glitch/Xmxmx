<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Block Games</title>

<style>

body{
margin:0;
font-family:Arial;
background:#121212;
color:white;
}

.header{
background:#222;
padding:15px;
font-size:24px;
}

.games{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
padding:15px;
}

.game{
background:#333;
padding:20px;
border-radius:10px;
text-align:center;
}

button{
margin-top:10px;
padding:10px 15px;
background:#00a2ff;
border:none;
color:white;
border-radius:6px;
}

</style>

</head>

<body>

<div class="header">My Block Games</div>

<div class="games">

<div class="game">
Parkour Game
<br>
<button onclick="play()">Play</button>
</div>

<div class="game">
Block Runner
<br>
<button onclick="play()">Play</button>
</div>

</div>

<script>

function play(){
alert("Game starting!");
}

</script>

</body>
</html>
