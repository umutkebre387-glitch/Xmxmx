<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mini Block World</title>

<style>
body{
margin:0;
background:#87CEEB;
overflow:hidden;
}

#avatar{
position:absolute;
bottom:60px;
left:100px;
width:60px;
height:100px;
}

.head{width:40px;height:40px;background:#ffd39b;margin:auto;}
.hair{width:40px;height:15px;background:#8B4513;margin:auto;}
.body{width:50px;height:40px;background:blue;margin:auto;}
.legs{width:50px;height:20px;background:black;margin:auto;}

.ground{
position:absolute;
bottom:0;
width:100%;
height:60px;
background:green;
}
</style>
</head>

<body>

<div id="avatar">
<div class="hair"></div>
<div class="head"></div>
<div class="body"></div>
<div class="legs"></div>
</div>

<div class="ground"></div>

<script>

let avatar = document.getElementById("avatar");
let x = 100;

document.addEventListener("touchstart", function(){
x += 30;
avatar.style.left = x + "px";
});

</script>

</body>
</html>
